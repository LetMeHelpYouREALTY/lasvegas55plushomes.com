name: Cloudflare Pages Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

# Cancel in-progress deployments for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      # Primary hosting is Vercel (Node). @cloudflare/next-on-pages requires
      # `export const runtime = 'edge'` on every dynamic route — not enabled
      # sitewide yet. Skip CF Pages builds on PRs so Node/Vercel CI stays green.
      - name: Skip Cloudflare Pages adapter on pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo "Skipping @cloudflare/next-on-pages on PRs."
          echo "App targets Vercel Node runtime; CF Pages needs Edge Runtime on all routes."

      # Belt-and-suspenders for main: vercel build may still probe Python.
      - name: Install uv (Vercel Python runtime prerequisite)
        if: github.event_name != 'pull_request'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        continue-on-error: true

      - name: Build for Cloudflare Pages
        id: cf_build
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          npm run build:cloudflare
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_REALSCOUT_AGENT_ID: ${{ secrets.NEXT_PUBLIC_REALSCOUT_AGENT_ID }}

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && steps.cf_build.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=heyberkshire-com --branch=${{ github.ref_name }}

  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: deploy
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

  # No CF Pages preview is published on PRs (Vercel is primary hosting),
  # so Lighthouse against *.pages.dev would hit a Chrome interstitial.
  performance-audit:
    name: Cloudflare Performance Audit
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://www.lasvegas55plushomes.com
          uploadArtifacts: true
          temporaryPublicStorage: true
